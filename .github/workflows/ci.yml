name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    name: Windows test & node smoke test
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Smoke test CLI
        shell: pwsh
        run: |
          node bin/codex-profile.js version
          node bin/codex-profile.js doctor
          node bin/codex-profile.js init test-ci
          node bin/codex-profile.js list
          node bin/codex-profile.js env test-ci --shell powershell
          node bin/codex-profile.js remove test-ci --yes

  test-unix:
    name: Linux & macOS smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Smoke test CLI
        run: |
          node bin/codex-profile.js version
          node bin/codex-profile.js doctor
          node bin/codex-profile.js init test-ci
          node bin/codex-profile.js list
          node bin/codex-profile.js env test-ci --shell bash
          node bin/codex-profile.js remove test-ci --yes

